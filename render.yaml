services:
  - type: web
    name: learnmate
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
